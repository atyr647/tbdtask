name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # SQLite lane — fast, covers app-layer logic and NOT NULL constraints.
  # -----------------------------------------------------------------------
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  # -----------------------------------------------------------------------
  # Postgres lane — runs RLS enforcement tests that are skipped on SQLite.
  # -----------------------------------------------------------------------
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tbdtask
          POSTGRES_PASSWORD: tbdtask
          POSTGRES_DB: tbdtask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbdtask"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,postgres]"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://tbdtask:tbdtask@localhost:5432/tbdtask
          TBDTASK_SKIP_AUTOMIGRATE: "1"
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://tbdtask:tbdtask@localhost:5432/tbdtask
          TBDTASK_SKIP_AUTOMIGRATE: "1"
        run: |
          python -m pytest tests/ -v --tb=short

  # -----------------------------------------------------------------------
  # Lint + format
  # -----------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check app/ tests/

      - name: Format check
        run: ruff format --check app/ tests/

  # -----------------------------------------------------------------------
  # Security: dependency audit, secrets scan, env hygiene.
  # -----------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,postgres,redis]"
          pip install pip-audit

      - name: Dependency vulnerability scan
        run: |
          pip-audit --format json --output pip-audit-results.json || true
          # Fail if any vulnerabilities found
          if grep -q '"vulns": \[\]' pip-audit-results.json; then
            echo "No vulnerabilities found"
          else
            echo "Vulnerabilities detected:"
            cat pip-audit-results.json
            exit 1
          fi

      - name: Secrets scan (detect hardcoded secrets)
        run: |
          # Scan for common secret patterns in source code
          python tools/scan_secrets.py app/ tools/ alembic/

      - name: Env hygiene check
        run: |
          # Verify .env.example is complete and .env is not committed
          python tools/check_env_hygiene.py

      - name: License scan
        run: |
          pip install pip-licenses
          pip-licenses --format=json --output-file licenses.json
          # Fail if any GPL/AGPL licenses found (copyleft risk).
          # Word-boundary match avoids false positives on LGPL.
          if python -c "
          import json, re
          with open('licenses.json') as f:
              licenses = json.load(f)
          forbidden = {'GPL-3.0', 'GPL-2.0', 'AGPL-3.0', 'AGPL-2.0'}
          patterns = [re.compile(rf'\b{re.escape(f)}') for f in forbidden]
          bad = [pkg for pkg in licenses if any(p.search(pkg.get('License', '')) for p in patterns)]
          if bad:
              print('Forbidden licenses found:')
              for pkg in bad:
                  print(f\"  {pkg['Name']}: {pkg['License']}\")
              exit(1)
          print('No forbidden licenses found')
          "; then
            echo "License scan passed"
          else
            exit 1
          fi

  # -----------------------------------------------------------------------
  # Backup/restore integration test
  # -----------------------------------------------------------------------
  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tbdtask
          POSTGRES_PASSWORD: tbdtask
          POSTGRES_DB: tbdtask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbdtask"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[postgres]"

      - name: Install pg_dump
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://tbdtask:tbdtask@localhost:5432/tbdtask
          TBDTASK_SKIP_AUTOMIGRATE: "1"
        run: |
          alembic upgrade head

      - name: Run backup/restore test
        env:
          DATABASE_URL: postgresql+psycopg://tbdtask:tbdtask@localhost:5432/tbdtask
          TBDTASK_SKIP_AUTOMIGRATE: "1"
        run: |
          bash tools/test_backup_restore.sh
