name: Release

# Builds the aarch64 AppImage and attaches it to a GitHub Release.
#
# Triggers:
#   - Push a tag matching v*    (e.g. ``git tag v0.1.1 && git push --tags``)
#   - Manual run via the Actions tab (workflow_dispatch). Manual runs upload
#     to a Release named after the chosen ref unless overridden.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the AppImage to (e.g. v0.1.1). Created if missing."
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write  # required to create releases + upload assets

jobs:
  build-aarch64-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ---- Cross-compile toolchain (x86_64 host → aarch64 target) ----
      - name: Install aarch64 cross GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config

      - name: Enable arm64 multiarch
        run: |
          sudo dpkg --add-architecture arm64
          # Restrict the default amd64 sources so apt doesn't try to fetch
          # arm64 from archive.ubuntu.com (which only hosts amd64/i386).
          sudo sed -i 's|^Types: deb$|Types: deb\nArchitectures: amd64|' \
            /etc/apt/sources.list.d/ubuntu.sources
          # Add arm64 sources from ports.ubuntu.com.
          sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update

      - name: Install aarch64 WebKitGTK + GTK dev libs
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev:arm64 \
            libgtk-3-dev:arm64 \
            libssl-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64

      # ---- Rust toolchain with aarch64 target ----
      - name: Install Rust + aarch64 target
        run: |
          rustup target add aarch64-unknown-linux-gnu

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/target
          key: cargo-target-${{ runner.os }}-aarch64-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/src/**') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-aarch64-

      # ---- Python (host interpreter; only used to drive pip --target) ----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- Build ----
      - name: Build AppImage
        run: |
          ARCH=aarch64 BUILD_TAURI=1 bash tools/build_appimage.sh

      - name: Inspect output
        run: |
          ls -la dist/*.AppImage
          file dist/*.AppImage
          sha256sum dist/*.AppImage > dist/SHA256SUMS
          cat dist/SHA256SUMS

      # ---- Release ----
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/tbdtask-*-aarch64.AppImage
            dist/SHA256SUMS
