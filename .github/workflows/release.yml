# .github/workflows/release.yml
# Builds the aarch64 AppImage (native tkinter UI) and attaches it to a
# GitHub Release.
#
# Triggered by either:
#   - Push a tag matching v*    (e.g. ``git tag v0.1.1 && git push --tags``)
#   - Manual run via the Actions tab (workflow_dispatch). Manual runs upload
#     to a release named after the chosen tag.
#
# The AppImage bundles a dynamically-linked Tk runtime assembled from arm64
# .debs (see tools/build_appimage.sh). No cross-compiler or WebKitGTK is
# needed — the build only extracts .debs and pip-installs arch-correct wheels.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the AppImage to (e.g. v0.1.1). Created if missing."
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write  # required to create releases + upload assets

jobs:
  build-aarch64-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          # ``ar`` (binutils) extracts .debs; ``squashfs-tools`` lets us
          # sanity-check the payload. appimagetool fetches its own runtime.
          sudo apt-get install -y binutils squashfs-tools file

      - name: Build aarch64 AppImage
        env:
          ARCH: aarch64
        run: |
          bash tools/build_appimage.sh

      - name: Verify the payload is ARM64 + dynamically-linked Tk
        run: |
          set -e
          OUT=$(ls dist/tbdtask-*-aarch64.AppImage)
          OFF=$(grep -abo 'hsqs' "$OUT" | tail -1 | cut -d: -f1)
          rm -rf payload && unsquashfs -o "$OFF" -d payload "$OUT" >/dev/null
          test -x payload/AppRun
          file payload/usr/python/bin/python3 | grep -q "ARM aarch64"
          TK=$(find payload -name '_tkinter*.so' | head -1)
          file "$TK" | grep -q "ARM aarch64"
          # _tkinter must link the bundled shared Tk (NOT statically), which
          # is the whole point of this build.
          objdump -p "$TK" | grep -q "NEEDED.*libtk8.6.so"
          test "$(find payload -name '*.so*' -exec file {} \; | grep -c 'x86-64')" = "0"
          echo "aarch64 dynamic-Tk payload verified."

      - name: Compute checksum
        run: |
          cd dist && sha256sum tbdtask-*.AppImage | tee SHA256SUMS

      - name: Upload AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/tbdtask-*.AppImage
            dist/SHA256SUMS
          fail_on_error: true
