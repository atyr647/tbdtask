[project]
name = "tbdtask"
version = "0.1.0"
description = "Offline weekly worklist and personnel tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Hosted-mode dependency. Not pulled in by the AppImage build, which uses
# the bundled SQLite. Install with ``pip install -e .[postgres]`` to run
# the hosted/multi-tenant backend (Phase 0+).
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
