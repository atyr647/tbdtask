[project]
name = "tbdtask"
version = "0.1.0"
description = "Offline weekly worklist and personnel tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Auth + security utilities (Phase 1). Authlib drives the OIDC clients
    # for Apple/Google/Microsoft; itsdangerous signs CSRF tokens and the
    # state/nonce we round-trip through OIDC redirects; httpx is Authlib's
    # async transport.
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    # WebAuthn (Phase 8a). Handles attestation parsing, signature
    # verification, and COSE key decoding. Audited library aligned
    # with the FIDO Alliance reference. Pin a major to keep behavior
    # stable through the security work.
    "webauthn>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Hosted-mode dependency. Not pulled in by the AppImage build, which uses
# the bundled SQLite. Install with ``pip install -e .[postgres]`` to run
# the hosted/multi-tenant backend (Phase 0+).
postgres = [
    "psycopg[binary]>=3.2",
]
# Redis-backed rate limiter for multi-worker deployments. Install with
# ``pip install -e .[redis]`` when running behind a load balancer.
redis = [
    "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
