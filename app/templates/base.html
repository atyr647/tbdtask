<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Worklist Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Home">
      <img src="/static/logo.svg" alt="" width="22" height="22" />
    </a>
    <nav>
      {% set p = request.url.path %}
      <a href="/" {% if p == "/" %}class="active"{% endif %}>Dashboard</a>
      <a href="/today" {% if p == "/today" or p.startswith("/day/") %}class="active"{% endif %}>Today</a>
      <a href="/worklists" {% if p.startswith("/worklists") or p.startswith("/tasks") or p.startswith("/task-templates") %}class="active"{% endif %}>Worklists</a>
      <a href="/personnel" {% if p.startswith("/personnel") %}class="active"{% endif %}>Personnel</a>
      <a href="/quals" {% if p.startswith("/quals") %}class="active"{% endif %}>Qualifications</a>
      <a href="/absences" {% if p.startswith("/absences") %}class="active"{% endif %}>Absences</a>
      <a href="/alerts" {% if p.startswith("/alerts") %}class="active"{% endif %}>Alerts</a>
      {% if request.state.membership is defined and request.state.membership %}
      <a href="/admin" {% if p.startswith("/admin") %}class="active"{% endif %}>Admin</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
