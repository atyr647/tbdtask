<script>
(function() {
  // Category filter narrows the title datalist suggestions visually by hiding
  // options whose label doesn't start with the chosen category. The list is
  // free-typeable so an off-list title still works.
  const cat = document.getElementById("rate-category");
  if (!cat) return;
  const list = document.getElementById("rate-suggestions");
  if (!list) return;
  const allOptions = Array.from(list.querySelectorAll("option")).map(o => ({
    el: o, label: o.textContent || ""
  }));
  cat.addEventListener("change", () => {
    const v = cat.value;
    for (const item of allOptions) {
      if (!v) {
        item.el.disabled = false;
        item.el.style.display = "";
      } else {
        const match = item.label.startsWith(v);
        item.el.disabled = !match;
        item.el.style.display = match ? "" : "none";
      }
    }
  });
})();
</script>
