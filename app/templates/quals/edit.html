{% extends "base.html" %}
{% block title %}Edit {{ qual.name }}{% endblock %}
{% block content %}
<p><a href="/quals">&lsaquo; Back to qual catalog</a></p>
<h1>Edit {{ qual.name }}</h1>
<form method="post" action="/quals/{{ qual.id }}" class="form">
  <label>Name <input name="name" value="{{ qual.name }}" required /></label>
  <label>Code <input name="code" value="{{ qual.code or '' }}" /></label>
  <label>Category <input name="category" value="{{ qual.category or '' }}" /></label>
  <label>Pinned column
    <input type="checkbox" name="pinned_column" value="1" {% if qual.pinned_column %}checked{% endif %} />
  </label>
  <label>Validity (days) <input type="number" name="validity_period_days" min="1" value="{{ qual.validity_period_days or '' }}" /></label>
  <label>Notes <textarea name="notes" rows="2">{{ qual.notes or '' }}</textarea></label>
  <div class="form-actions">
    <button type="submit">Save</button>
    <a href="/quals" class="btn-link">Cancel</a>
  </div>
</form>

<form method="post" action="/quals/{{ qual.id }}/archive" class="form-inline danger">
  <label>Archive reason <input name="reason" placeholder="optional" /></label>
  <button type="submit" onclick="return confirm('Archive {{ qual.name }}? Existing person-quals are preserved.');">Archive</button>
</form>
{% endblock %}
