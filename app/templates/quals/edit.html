{% extends "base.html" %}
{% from "_macros.html" import back_link %}
{% block title %}Edit {{ qual.name }}{% endblock %}
{% block page_title %}Edit qual{% endblock %}
{% block content %}
{{ back_link("/quals", "Back to qual catalog") }}
<h1>Edit {{ qual.name }}</h1>
<form method="post" action="/quals/{{ qual.id }}" class="form">
  <label>Name <input name="name" value="{{ qual.name }}" required /></label>
  <div class="form-actions">
    <button type="submit">Save</button>
    <a href="/quals" class="btn-ghost">Cancel</a>
  </div>
</form>

<form method="post" action="/quals/{{ qual.id }}/archive" class="form-inline danger">
  <label>Archive reason <input name="reason" placeholder="optional" /></label>
  <button type="submit" data-confirm="Archive {{ qual.name }}? Existing person-quals are preserved." >Archive</button>
</form>
{% endblock %}
