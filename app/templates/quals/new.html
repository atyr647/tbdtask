{% extends "base.html" %}
{% block title %}New qualification{% endblock %}
{% block content %}
<p><a href="/quals">&lsaquo; Back to qual catalog</a></p>
<h1>Add qualification</h1>
<form method="post" action="/quals" class="form">
  <label>Name <input name="name" required /></label>
  <label>Code <input name="code" placeholder="short label, optional" /></label>
  <label>Category <input name="category" placeholder="WC, DS, BPT, Vehicles, …" /></label>
  <label>Pinned column <input type="checkbox" name="pinned_column" value="1" /></label>
  <label>Validity (days) <input type="number" name="validity_period_days" min="1" placeholder="leave blank if no expiry" /></label>
  <label>Notes <textarea name="notes" rows="2"></textarea></label>
  <div class="form-actions">
    <button type="submit">Create</button>
    <a href="/quals" class="btn-link">Cancel</a>
  </div>
</form>
{% endblock %}
