[package]
name = "tbdtask-desktop"
version = "0.1.0"
edition = "2021"
description = "Native Tauri wrapper around the local FastAPI worklist tracker"
license = "Proprietary"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
